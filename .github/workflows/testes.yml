name: Testes

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compilar
        run: python -m compileall -q app testes
      - name: Testes rápidos
        run: python -m unittest discover -s testes -v

  lancador:
    name: Axtel.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: bash lancador/compilar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Axtel.exe
          path: lancador/Axtel.exe
